services:

  # ── PHP Application (Laravel) ───────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rms_app
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      APP_ENV: "${APP_ENV:-local}"
      APP_DEBUG: "${APP_DEBUG:-true}"
      APP_URL: "${APP_URL:-http://localhost:8000}"
      DB_CONNECTION: "${DB_CONNECTION:-mysql}"
      DB_HOST: "${DB_HOST:-db}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_DATABASE: "${DB_DATABASE:-rms_cspc}"
      DB_USERNAME: "${DB_USERNAME:-rms_user}"
      DB_PASSWORD: "${DB_PASSWORD:-secret}"
      CACHE_STORE: "${CACHE_STORE:-database}"
      SESSION_DRIVER: "${SESSION_DRIVER:-database}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-database}"
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      # Bind-mount source — changes reflect instantly without rebuilding
      - .:/var/www/html
      # Named volume for vendor/ so it stays inside the container
      - vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rms_net

  # ── Node / Vite ─────────────────────────────────────────────────────────────
  node:
    image: node:20-alpine
    container_name: rms_node
    working_dir: /app
    environment:
      DOCKER: "true"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev"
    networks:
      - rms_net

  # ── MySQL 8 ─────────────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: rms_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-rootsecret}"
      MYSQL_DATABASE: "${DB_DATABASE:-rms_cspc}"
      MYSQL_USER: "${DB_USERNAME:-rms_user}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-secret}"
    ports:
      # 3307 on host so it doesn't clash with a local MySQL install
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - rms_net

  # ── phpMyAdmin ─────────────────────────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: rms_phpmyadmin
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-rootsecret}"
    ports:
      - "8081:80"
    networks:
      - rms_net

volumes:
  db_data:
  vendor:
  node_modules:

networks:
  rms_net:
    driver: bridge
