services:

  # ── PHP Application (Laravel + Nginx Combined) ──────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rms_app
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    env_file:
      - .env.docker
    volumes:
      # Bind-mount source — changes reflect instantly without rebuilding
      - .:/var/www/html
      # Named volume for vendor/ so it stays inside the container
      - vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rms_net

  # ── Node / Vite ─────────────────────────────────────────────────────────────
  node:
    image: node:20-alpine
    container_name: rms_node
    working_dir: /app
    environment:
      DOCKER: "true"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev"
    networks:
      - rms_net

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: rms_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: rms
      POSTGRES_USER: adminrms
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adminrms -d rms"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - rms_net

  # ── Adminer ─────────────────────────────────────────────────────────────────
  adminer:
    image: adminer:latest
    container_name: rms_adminer
    restart: unless-stopped
    ports:
      - "49180:8080"
    networks:
      - rms_net

  # ── WebSocket Server (Node) ──────────────────────────────────────────────────
  websocket:
    image: node:20-alpine
    container_name: rms_websocket
    working_dir: /app/public/chatify/ws-server
    restart: unless-stopped
    environment:
      - PORT=${WS_PORT:-8080}
    volumes:
      - .:/app
    env_file:
      - .env.docker
    command: sh -c "npm install && node server.js"
    networks:
      - rms_net


volumes:
  pg_data:
  vendor:
  node_modules:

networks:
  rms_net:
    driver: bridge
