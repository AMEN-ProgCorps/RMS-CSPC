# Strip internal authentication headers for non-internal traffic
map $remote_addr $internal_secret_header {
    "127.0.0.1"     $http_x_internal_secret;
    "::1"           $http_x_internal_secret;
    "~^10\."        $http_x_internal_secret;
    "~^172\.(1[6-9]|2[0-9]|3[0-1])\." $http_x_internal_secret;
    "~^192\.168\."  $http_x_internal_secret;
    default         "";
}

map $remote_addr $internal_acc_id_header {
    "127.0.0.1"     $http_x_internal_account_id;
    "::1"           $http_x_internal_account_id;
    "~^10\."        $http_x_internal_account_id;
    "~^172\.(1[6-9]|2[0-9]|3[0-1])\." $http_x_internal_account_id;
    "~^192\.168\."  $http_x_internal_account_id;
    default         "";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 200M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # pdf.js worker is emitted as .mjs; many nginx images omit that extension from
    # mime.types and fall back to application/octet-stream, which browsers reject
    # for ES module / module-worker loads (breaks DRR PDF compare).
    location ~* \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Reverse Proxy for Messify Node.js WebSocket Server
    location /ws {
        proxy_pass http://websocket:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # Block internal Chatify / Messify directories
    location ~* ^/(chatify|messify)/(config|core|storage|ws-server)(/|$) {
        deny all;
        return 404;
    }

    # Strict block for direct HTTP access to WebSocket server files
    location ~* /(ws-server|server\.js) {
        deny all;
        return 404;
    }

    # Restrict internal presence correction endpoint strictly to local/docker callers
    location ~ ^/(chatify|messify)/mark_offline\.php$ {
        allow 127.0.0.1;
        allow ::1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_param HTTP_X_INTERNAL_SECRET $internal_secret_header;
        fastcgi_param HTTP_X_INTERNAL_ACCOUNT_ID $internal_acc_id_header;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_param HTTP_X_INTERNAL_SECRET $internal_secret_header;
        fastcgi_param HTTP_X_INTERNAL_ACCOUNT_ID $internal_acc_id_header;
        fastcgi_hide_header X-Powered-By;
        # DRR OCR (Ghostscript + PaddleOCR) can take several minutes on large scans.
        fastcgi_read_timeout 600s;
        fastcgi_send_timeout 600s;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
