[PHP]
; Scanned masterlist PDFs can be large (400+ pages). Keep these aligned with
; RegisterPersistHelper::SCAN_MAX_KB and the register UI MAX_FILE_SIZE (200MB).
upload_max_filesize = 200M
post_max_size = 200M
memory_limit = 512M
max_execution_time = 600
max_input_time = 600
date.timezone = Asia/Manila
